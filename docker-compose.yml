# 本地联调用 compose：一条命令起 Prowlarr + 插件
#
#   docker compose up -d
#
# 然后：
#   1. 打开 http://localhost:9696 配置 Prowlarr（加索引器，成人站选 Sukebei 等）
#   2. 打开 http://localhost:7000/configure 生成 Stremio 安装链接

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    # 1GB 内存机器的保命上限：单容器最多吃 450MB，超额自己崩，不拖垮整机
    # （实测 .NET 运行时峰值可到 380MB+，350m 会触发频繁重启，故放宽）
    mem_limit: 450m

  # Cloudflare 解盾器：Prowlarr 添加索引器时报 "blocked by CloudFlare Protection"
  # 的站点会自动改走这里。在 Prowlarr → Settings → Indexers → FlareSolverr 填：
  #   http://flaresolverr:8191
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=Europe/Madrid
      - LOG_LEVEL=info
    restart: unless-stopped
    # Chrome 是无头内存怪兽，必须上笼头；解盾失败最多重试，不能杀整机
    mem_limit: 300m

  stremio-addon:
    build: .
    container_name: stremio-prowlarr-rd
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
    restart: unless-stopped
    mem_limit: 150m
    depends_on:
      - prowlarr
